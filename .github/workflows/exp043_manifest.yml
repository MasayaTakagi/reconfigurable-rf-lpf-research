name: EXP-043 bootstrap provenance before numerical topology search
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/bootstrap_exp043_manifest.py
      - .github/workflows/exp043_manifest.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preflight:
    if: github.head_ref == 'research/exp043-3l-single-shunt-multimode'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/exp043-3l-single-shunt-multimode
          persist-credentials: true
      - uses: astral-sh/setup-uv@v6
      - name: Verify main reservation
        run: |
          git fetch origin main --depth=1
          python scripts/experiment_id_registry.py --experiment-id EXP-043 --owner MasayaTakagi --main-ref origin/main
      - name: Freeze pre-run RF-T005 provenance and inventory
        run: |
          uv sync --frozen
          uv run --frozen python scripts/bootstrap_exp043_manifest.py
          uv run --frozen python scripts/audit_results.py
          python scripts/audit_experiment_inventory.py
      - name: Commit manifest/index/inventory on research branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/chatgpt_topology_search/runs/EXP-043/manifest.json data/experiment_index.csv data/experiment_evidence_inventory.csv
          if ! git diff --cached --quiet; then
            git commit -m 'EXP-043 commit RF-T005 preflight provenance, index, inventory'
            git push origin HEAD:refs/heads/research/exp043-3l-single-shunt-multimode
          fi
