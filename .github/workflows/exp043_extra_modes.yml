name: EXP-043 third finite resonant mode topology study
on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/chatgpt_topology_search/runs/EXP-043/search_extra_modes.py'
      - '.github/workflows/exp043_extra_modes.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: [zero_trap_out, zero_trap_in, one_trap_out, two_trap_out]
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Verify experiment ledger
        run: |
          git fetch origin main --depth=1
          python scripts/experiment_id_registry.py --experiment-id EXP-043 --owner MasayaTakagi --main-ref origin/main
      - run: uv sync --frozen
      - name: Optimize topology and derive undamped LC eigenmodes
        run: |
          uv run --frozen python experiments/chatgpt_topology_search/runs/EXP-043/search_extra_modes.py \
            --variant ${{ matrix.variant }} --starts 4 --maxiter 140 --coarse 5 --dense 701 \
            --output results/EXP-043/${{ matrix.variant }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp043-${{ matrix.variant }}
          path: results/EXP-043/${{ matrix.variant }}.json
          if-no-files-found: warn
