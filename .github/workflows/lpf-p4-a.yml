name: LPF P4-A resumable shards

on:
  workflow_dispatch:
    inputs:
      shard_count:
        description: Number of deterministic shards
        required: true
        default: "4"
        type: choice
        options: ["1", "2", "4", "8"]
      attempts:
        description: Seeded graph sampling attempts per cell
        required: true
        default: "1"
        type: choice
        options: ["1", "2", "4", "50", "100", "200"]
      per_bin:
        description: Selected candidates per node and area cell
        required: true
        default: "1"
        type: choice
        options: ["1", "2"]
      starts:
        description: SLSQP starts per graph and layout
        required: true
        default: "1"
        type: choice
        options: ["1", "2"]
      layouts:
        description: Coupling layouts per graph
        required: true
        default: "1"
        type: choice
        options: ["1", "2", "3"]
      iterations:
        description: Maximum SLSQP iterations per start
        required: true
        default: "3"
        type: choice
        options: ["1", "3", "10", "15"]
      coarse_points:
        description: Passband points per segment during optimization
        required: true
        default: "2"
        type: choice
        options: ["2", "3"]
      validation_points:
        description: Passband points per segment during validation
        required: true
        default: "3"
        type: choice
        options: ["2", "3", "21"]
      max_graphs_per_batch:
        description: Newly completed graph units per shard before checkpoint artifact upload
        required: true
        default: "1"
        type: choice
        options: ["1", "2", "4"]
      max_batch_seconds:
        description: Wall-time budget before the next graph unit in each shard batch
        required: true
        default: "1200"
        type: choice
        options: ["600", "1200"]
      resume_run_id:
        description: Optional prior workflow run ID containing shard checkpoints
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: lpf-p4-a-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked scientific dependencies
        run: uv sync --frozen
      - run: echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Audit saved research data
        run: python scripts/audit_results.py
      - name: Run regression tests
        run: python -m unittest discover -s tests -v

  shards:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard_index: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Mark inactive matrix slot
        if: ${{ matrix.shard_index >= fromJSON(inputs.shard_count) }}
        run: echo "Shard slot is outside the requested shard count."
      - uses: actions/checkout@v7
        if: ${{ matrix.shard_index < fromJSON(inputs.shard_count) }}
      - uses: actions/setup-python@v7
        if: ${{ matrix.shard_index < fromJSON(inputs.shard_count) }}
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        if: ${{ matrix.shard_index < fromJSON(inputs.shard_count) }}
        with:
          version: "0.12.23"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked scientific dependencies
        if: ${{ matrix.shard_index < fromJSON(inputs.shard_count) }}
        run: uv sync --frozen
      - if: ${{ matrix.shard_index < fromJSON(inputs.shard_count) }}
        run: echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Create shard output directory
        if: ${{ matrix.shard_index < fromJSON(inputs.shard_count) }}
        run: mkdir -p "results/shard-${{ matrix.shard_index }}"
      - name: Check whether the resume artifact exists
        id: resume_artifact
        if: ${{ inputs.resume_run_id != '' && matrix.shard_index < fromJSON(inputs.shard_count) }}
        run: >-
          python scripts/check_p4_a_artifact.py
          --run-id "$RESUME_RUN_ID"
          --artifact-name "lpf-p4-a-shard-${{ matrix.shard_index }}"
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
      - name: Restore previous shard checkpoint
        if: ${{ inputs.resume_run_id != '' && steps.resume_artifact.outputs.found == 'true' && matrix.shard_index < fromJSON(inputs.shard_count) }}
        uses: actions/download-artifact@v7
        with:
          name: lpf-p4-a-shard-${{ matrix.shard_index }}
          path: results/shard-${{ matrix.shard_index }}
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ github.token }}
      - name: Run or resume this P4-A shard
        if: ${{ matrix.shard_index < fromJSON(inputs.shard_count) }}
        env:
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
          RESUME_ARTIFACT_FOUND: ${{ steps.resume_artifact.outputs.found }}
        shell: bash
        run: |
          RESUME_ARGS=()
          if [[ -n "$RESUME_RUN_ID" ]]; then
            if [[ "$RESUME_ARTIFACT_FOUND" == "true" ]]; then
              RESUME_ARGS+=(--resume --resume-run-id "$RESUME_RUN_ID")
            else
              echo "::warning::No restorable shard artifact in run $RESUME_RUN_ID; restarting this shard from its first graph."
              echo "Resume artifact missing or expired; this shard starts from scratch." >> "$GITHUB_STEP_SUMMARY"
              RESUME_ARGS+=(--resume-run-id "$RESUME_RUN_ID" --resume-artifact-missing)
            fi
          fi
          python experiments/matching_limit/p4_batch.py \
            --attempts "${{ inputs.attempts }}" \
            --per-bin "${{ inputs.per_bin }}" \
            --starts "${{ inputs.starts }}" \
            --layouts "${{ inputs.layouts }}" \
            --iterations "${{ inputs.iterations }}" \
            --coarse-points "${{ inputs.coarse_points }}" \
            --validation-points "${{ inputs.validation_points }}" \
            --seed 20261011 \
            --shard-count "${{ inputs.shard_count }}" \
            --shard-index "${{ matrix.shard_index }}" \
            --checkpoint "results/shard-${{ matrix.shard_index }}/checkpoint.json" \
            --output "results/shard-${{ matrix.shard_index }}/result.json" \
            --max-graphs-per-batch "${{ inputs.max_graphs_per_batch }}" \
            --max-batch-seconds "${{ inputs.max_batch_seconds }}" \
            "${RESUME_ARGS[@]}"
      - name: Upload checkpoint and partial result
        if: ${{ always() && matrix.shard_index < fromJSON(inputs.shard_count) }}
        id: persist_checkpoint
        uses: actions/upload-artifact@v7
        with:
          name: lpf-p4-a-shard-${{ matrix.shard_index }}
          path: results/shard-${{ matrix.shard_index }}/
          if-no-files-found: error
          retention-days: 14
      - name: Confirm checkpoint artifact was persisted
        if: ${{ always() && steps.persist_checkpoint.outcome == 'success' }}
        env:
          ARTIFACT_ID: ${{ steps.persist_checkpoint.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.persist_checkpoint.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.persist_checkpoint.outputs.artifact-digest }}
        run: |
          if [[ -z "$ARTIFACT_ID" || -z "$ARTIFACT_DIGEST" ]]; then
            echo "::error::Artifact upload did not return an artifact ID and digest."
            exit 1
          fi
          echo "Checkpoint artifact persisted: id=$ARTIFACT_ID digest=$ARTIFACT_DIGEST" >> "$GITHUB_STEP_SUMMARY"
          echo "Artifact URL: $ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"

  aggregate:
    needs: [preflight, shards]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Download available shard artifacts
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          pattern: lpf-p4-a-shard-*
          path: results/shards
          merge-multiple: false
      - name: Aggregate and account for missing or failed shards
        run: >-
          python scripts/aggregate_p4_a_shards.py
          --input-dir results/shards
          --expected-shards "${{ inputs.shard_count }}"
          --matrix-result "${{ needs.shards.result }}"
          --output results/p4_a_aggregate.json
      - name: Upload aggregate report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lpf-p4-a-aggregate-${{ github.run_id }}
          path: results/p4_a_aggregate.json
          if-no-files-found: warn
          retention-days: 14
