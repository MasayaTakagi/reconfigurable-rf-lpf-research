name: Phase 2 Step 1 repository inventory

on:
  push:
    branches:
      - docs/phase2-repository-reorganization-plan-20261017

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true
      - name: Fix main tree to audited commit
        run: git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
      - name: Execute read-only source tree and dependency audit
        run: python3 scripts/audit_repository_reorganization_step1.py
      - name: Print human report
        run: sed -n '1,100p' docs/repository_audits/step1_20261017_report.md
      - uses: actions/upload-artifact@v4
        with:
          name: phase2-step1-repository-inventory
          path: |
            docs/repository_audits/step1_20261017_report.md
            data/repository_audits/step1_20261017_*
          retention-days: 30
      - name: Commit audited snapshot to branch (not main)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/repository_audits/step1_20261017_report.md data/repository_audits/step1_20261017_*
          if git diff --cached --quiet; then
            echo 'No inventory changes'
          else
            git commit -m 'docs(audit): record Step 1 main repository inventory [skip ci]'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
