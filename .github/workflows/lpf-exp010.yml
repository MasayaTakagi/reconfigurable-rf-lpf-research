name: LPF Phase 2 EXP-010 Q25 mixed-cap topology exploration

on:
  workflow_dispatch:
    inputs:
      family:
        description: Mixed GJM / PCB-C topology family to screen
        required: true
        type: choice
        options: [pcb_move, gjm_move, second_pcb]
        default: second_pcb
      starts:
        description: Local SLSQP starts per topology
        required: true
        type: choice
        options: ['1', '2', '4']
        default: '2'
      iterations:
        description: SLSQP maximum iterations per start
        required: true
        type: choice
        options: ['250', '500', '1000']
        default: '500'
      new_jobs_per_shard:
        description: New graph units per shard this invocation
        required: true
        type: choice
        options: ['1', '2', '4']
        default: '2'
      resume_run_id:
        description: Prior run id with checkpoint artifacts; same settings required
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: phase2-exp010-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - run: echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Reproduce saved Phase 2 EXP010 candidates
        run: |
          python experiments/chatgpt_topology_search/runs/EXP-010/verify.py
          python experiments/chatgpt_topology_search/runs/EXP-010/verify_mixed.py
          python experiments/chatgpt_topology_search/runs/EXP-010/mixed_study.py --reference-only

  optimize:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard_index: [0, 1, 2, 3]
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - run: echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Prepare workdir
        run: mkdir -p results/exp010/shard-${{ matrix.shard_index }}
      - name: Locate resume checkpoint artifact
        id: resume
        if: ${{ inputs.resume_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/check_p4_a_artifact.py
          --run-id "${{ inputs.resume_run_id }}"
          --artifact-name "exp010-shard-${{ matrix.shard_index }}"
      - name: Restore checkpoint from selected prior run
        if: ${{ inputs.resume_run_id != '' && steps.resume.outputs.found == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: exp010-shard-${{ matrix.shard_index }}
          path: results/exp010/shard-${{ matrix.shard_index }}
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ github.token }}
      - name: Execute finite Phase 2 local searches
        run: |
          python experiments/chatgpt_topology_search/runs/EXP-010/mixed_study.py \
            --family "${{ inputs.family }}" \
            --shard-count 4 --shard-index "${{ matrix.shard_index }}" \
            --starts "${{ inputs.starts }}" \
            --iterations "${{ inputs.iterations }}" \
            --max-new-jobs "${{ inputs.new_jobs_per_shard }}" \
            --points 21 --atten 30.02 --seed 20261012 \
            --checkpoint "results/exp010/shard-${{ matrix.shard_index }}/checkpoint.json"
      - name: Persist partial checkpoint even on computation failure
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: exp010-shard-${{ matrix.shard_index }}
          path: results/exp010/shard-${{ matrix.shard_index }}/
          if-no-files-found: warn
          retention-days: 14

  summarize:
    needs: [preflight, optimize]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download all available calculation artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: exp010-shard-*
          path: results/exp010/shards
          merge-multiple: false
      - name: Count completed, incomplete, missing, and failed work explicitly
        run: |
          python experiments/chatgpt_topology_search/runs/EXP-010/summarize.py \
            --input-dir results/exp010/shards --expected-shards 4 \
            --output results/exp010/summary.json
      - name: Archive aggregate
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: exp010-summary-${{ github.run_id }}
          path: results/exp010/summary.json
          if-no-files-found: warn
          retention-days: 14