name: Manual bounded numerical research regressions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install scientific dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate saved research data
        run: python scripts/audit_results.py
      - name: Verify no-PCB tunable-shunt candidates
        run: python scripts/verify_no_pcb_tunable_candidates.py
      - name: Run lightweight regression tests
        run: python -m unittest discover -s tests -v
      - name: Verify adjacent 1D independent MNA baseline
        run: python experiments/matching_cost_20261010/verify_adjacent_1d.py
      - name: Reproduce bounded LQP02 minimax baseline
        run: python experiments/matching_cost_20261010/reoptimize_lqp02.py
      - name: Run bounded topology enumeration regression
        run: python experiments/matching_limit/enumerate_graphs.py --nodes 3 --branches 6
      - name: Run existing parallel chip screen regression
        run: python experiments/matching_limit/parallel_chip_screen.py
      - name: Run bounded graph MNA screen regression
        run: python experiments/matching_limit/graph_mna_screen.py --max-candidates 4 --max-raw 200
      - name: Run bounded grounded MNA screen regression
        run: python experiments/matching_limit/grounded_mna_screen.py --max-raw 3000 --per-bin 1
