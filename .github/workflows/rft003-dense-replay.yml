name: RF-T003 archived Phase 2 dense replay

on:
  push:
    branches:
      - research/rft003-7l-three-pcb-030-20261013
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: mkdir -p results/rft003-review
      - name: Dense 5L cost6p33 replay — 28 separate bands, 7001 samples, 84 independent MNA points
        run: python scripts/verify_rft003_5l_cost.py --points 7001 > results/rft003-review/five_L.json
      - name: Dense 7L replay — 28 separate bands, 7001 samples, 84 independent MNA points
        run: python scripts/verify_rft003_7l_best.py --points 7001 > results/rft003-review/seven_L.json
      - name: Dense cheaper near-miss replay — no promotion
        run: python scripts/verify_rft003_5l_1gjm_nearmiss.py --points 7001 > results/rft003-review/near_miss.json
      - name: Enforce historical trial scope and numerical distinction
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from src.lpf.constraint_versions import load_constraint, constraint_fingerprint
          root=Path("results/rft003-review")
          five=json.loads((root/"five_L.json").read_text())
          seven=json.loads((root/"seven_L.json").read_text())
          miss=json.loads((root/"near_miss.json").read_text())
          trial=load_constraint("RF-T003",allow_trial=True)
          assert trial["trial_base_constraint_id"]=="RF-F001"
          assert load_constraint()["active_constraint_id"]=="RF-F002"
          assert constraint_fingerprint(trial)=="e0c45f7094ced1ed2ccb91cae474c7c3c1a6af73a495a2a9cf8f512ccb45ab08"
          assert five["LOW_IL_30p01"]["IL_goal_pass"]
          assert abs(five["LOW_IL_30p01"]["IL_db"]-0.295989813713)<1e-7
          assert seven["meets_trial_IL_0p30"]
          assert abs(seven["worst_IL_db"]-0.29984526946634216)<1e-7
          assert not miss["IL_goal_pass"]
          assert miss["IL_db"]>0.30
          print("PASS: independent finite-grid replay under *historical* RF-T003")
          PY
      - name: Save complete finite-grid numerical replay evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rft003-pr34-dense-replay
          path: results/rft003-review/
          if-no-files-found: warn
          retention-days: 30
