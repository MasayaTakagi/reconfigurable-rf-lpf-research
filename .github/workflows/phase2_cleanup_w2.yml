name: Phase 2 W2 topology search catalog

on:
  pull_request:
    paths:
      - '.github/workflows/phase2_cleanup_w2.yml'
      - 'scripts/build_phase2_topology_search.py'
      - 'tests/test_phase2_topology_search.py'
      - 'data/catalog/phase2_topology_search_20261017*'
      - 'docs/results/phase2_topology_search_20261017.md'
      - 'docs/results/README.md'
      - 'data/catalog/README.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source-pinned structure, connectivity evidence and coupling signs
        run: python3 -m unittest tests.test_phase2_topology_search -v
      - name: Verify derived W2 CSV, summary JSON and report byte-for-byte
        run: python3 scripts/build_phase2_topology_search.py --check
