name: Phase 2 W2 topology search catalog

on:
  push:
    branches:
      - feat/phase2-w2-topology-search-index-20261017
  pull_request:
    paths:
      - '.github/workflows/phase2_cleanup_w2.yml'
      - 'scripts/build_phase2_topology_search.py'
      - 'tests/test_phase2_topology_search.py'
      - 'data/catalog/phase2_topology_search_20261017*'
      - 'docs/results/phase2_topology_search_20261017.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check archive catalog, sources and structural search labels
        run: python -m unittest tests.test_phase2_topology_search -v
      - name: Verify generated W2 derived artifacts before mutation
        if: github.event_name != 'push'
        run: python scripts/build_phase2_topology_search.py --check
      - name: Generate the three review-only artifacts
        if: github.event_name == 'push'
        run: |
          python scripts/build_phase2_topology_search.py
          python scripts/build_phase2_topology_search.py --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase2-w2-topology-index
          path: |
            data/catalog/phase2_topology_search_20261017*
            docs/results/phase2_topology_search_20261017.md
          retention-days: 30

  commit-snapshot-to-review-branch:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate and commit derived files only, never source files
        run: |
          python scripts/build_phase2_topology_search.py
          python scripts/build_phase2_topology_search.py --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/catalog/phase2_topology_search_20261017.csv
          git add data/catalog/phase2_topology_search_20261017_summary.json
          git add docs/results/phase2_topology_search_20261017.md
          if git diff --cached --quiet; then
            echo 'W2 artifacts unchanged'
          else
            git commit -m 'data(w2): retain sourced structural index in review branch [skip ci]'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
