name: EXP-042 RF-T005 BSF Phase 2 optimization

on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/chatgpt_topology_search/runs/EXP-042/**'
      - '.github/workflows/exp042_rf_t005.yml'
  workflow_dispatch:
    inputs:
      target:
        description: 'H2/H3 minimum attenuation'
        type: choice
        required: true
        default: '30'
        options: ['30', '35']

permissions:
  contents: read

jobs:
  numerical:
    name: RF-T005 H2H3 ${{ matrix.target }} dB
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        target: [30, 35]
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Verify central main reservation and frozen RF-T005 trial
        shell: bash
        run: |
          git fetch origin main --depth=1
          python scripts/experiment_id_registry.py --experiment-id EXP-042 --owner MasayaTakagi --main-ref origin/main
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path(".")
          reg=json.loads((root/"data/constraints/registry.json").read_text())
          assert reg["active_formal_id"] == "RF-F003"
          assert reg["trial"]["RF-T005"]["base_constraint_id"] == "RF-F003"
          print("PASS: EXP-042 reservation and RF-T005 trial resolved")
          PY
      - name: Validate pinned environment
        run: uv sync --frozen
      - name: Optimize full external-port LPF
        run: |
          uv run --frozen python experiments/chatgpt_topology_search/runs/EXP-042/optimize.py             --target ${{ matrix.target }}.05 --starts 3 --maxiter 140             --grid 9 --verify-grid 1001 --seed 20261016             --out results/EXP-042/target_${{ matrix.target }}.json
      - name: Upload numerical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp042-rft005-target-${{ matrix.target }}
          path: results/EXP-042/target_${{ matrix.target }}.json
          if-no-files-found: warn

  independent_validation:
    name: EXP-042 full S2P 7001-grid / independent MNA
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Reproduce saved candidates on full grid and independent circuit solver
        run: |
          uv sync --frozen
          uv run --frozen python experiments/chatgpt_topology_search/runs/EXP-042/verify.py
      - name: Upload MNA and dense-grid evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp042-rft005-independent-7001
          path: results/EXP-042/verification_7001.json
          if-no-files-found: warn
