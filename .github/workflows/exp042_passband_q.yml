name: EXP-042 4L passband driven magnetic Q and ohmic loss
on:
  pull_request:
    branches: [main]
    paths:
      - experiments/chatgpt_topology_search/runs/EXP-042/analyze_passband_q.py
      - .github/workflows/exp042_passband_q.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Verify main EXP-042 reservation
        run: |
          git fetch origin main --depth=1
          python scripts/experiment_id_registry.py --experiment-id EXP-042 --owner MasayaTakagi --main-ref origin/main
      - name: Frozen dependency installation
        run: uv sync --frozen
      - name: Compute 4L Q, loss, IL, harmonic figures with required S2P
        run: |
          uv run --frozen python experiments/chatgpt_topology_search/runs/EXP-042/analyze_passband_q.py \
            --grid 1001 --out results/EXP-042/driven_passband_magnetic_q.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp042-4L-passband-magnetic-Q
          path: results/EXP-042/driven_passband_magnetic_q.json
          if-no-files-found: warn
