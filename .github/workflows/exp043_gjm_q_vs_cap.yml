name: EXP-043 isolate fixed GJM Q80 effect vs capacitance range
on:
  pull_request:
    branches: [main]
    paths:
      - experiments/chatgpt_topology_search/runs/EXP-043/diagnose_GJM_Q_vs_C.py
      - .github/workflows/exp043_gjm_q_vs_cap.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  study:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        variant:
          - gjm_cp_Q80_tightC0p2
          - gjm_cf0_cp_Q80_tightC0p2
          - gjm_cp_Q40_highC_OFFSPEC
          - gjm_cf0_cp_Q40_highC_OFFSPEC
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Confirm EXP-043 Phase2 prior main reservation
        run: |
          git fetch origin main --depth=1
          python scripts/experiment_id_registry.py --experiment-id EXP-043 --owner MasayaTakagi --main-ref origin/main
      - run: uv sync --frozen
      - name: Constrained minimax capacitor material Q and max-C contrasts
        run: |
          uv run --frozen python experiments/chatgpt_topology_search/runs/EXP-043/diagnose_GJM_Q_vs_C.py \
            --variant ${{ matrix.variant }} --starts 4 --maxiter 220 \
            --coarse 9 --dense 1001 \
            --out results/EXP-043/capacity_vs_q_${{ matrix.variant }}.json
      - name: Save complete vector/independent 7x7 MNA result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp043-Q-vs-cap-${{ matrix.variant }}
          path: results/EXP-043/capacity_vs_q_${{ matrix.variant }}.json
          if-no-files-found: warn
