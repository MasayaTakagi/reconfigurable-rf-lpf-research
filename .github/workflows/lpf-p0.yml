name: LPF P0 runner endurance pilot

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "Duration of validation workload (1-30 minutes)"
        required: true
        default: "2"
        type: choice
        options:
          - "2"
          - "10"
          - "30"

permissions:
  contents: read

concurrency:
  group: lpf-p0-${{ github.ref }}
  cancel-in-progress: false

jobs:
  p0-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install scientific dependencies
        run: python -m pip install -r requirements.txt
      - name: Run reproducibility and endurance pilot
        run: python scripts/p0_runner_pilot.py --minutes "${{ inputs.minutes }}" --output results/p0_runner_pilot.json
      - name: Upload checkpoint even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-pilot-${{ github.run_id }}
          path: results/p0_runner_pilot.json
          if-no-files-found: warn
          retention-days: 14
