name: EXP-043 RF-T005 shunt tap placement exploration
on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/chatgpt_topology_search/runs/EXP-043/search_shunt_position.py'
      - '.github/workflows/exp043_shunt_position.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  position:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: [shunt_in_zero, shunt_out_zero, shunt_in_twoGJM, shunt_out_twoGJM, shunt_in_zeroBridge, shunt_out_zeroBridge]
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Confirm reserved EXP-043 and Phase 2 preflight
        run: |
          git fetch origin main --depth=1
          python scripts/experiment_id_registry.py --experiment-id EXP-043 --owner MasayaTakagi --main-ref origin/main
      - run: uv sync --frozen
      - name: Optimize relocated single shunt
        run: |
          uv run --frozen python experiments/chatgpt_topology_search/runs/EXP-043/search_shunt_position.py \
            --variant ${{ matrix.variant }} --starts 4 --maxiter 140 --coarse 5 --dense 701 \
            --output results/EXP-043/${{ matrix.variant }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp043-${{ matrix.variant }}
          path: results/EXP-043/${{ matrix.variant }}.json
          if-no-files-found: warn
