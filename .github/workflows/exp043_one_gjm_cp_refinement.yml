name: EXP-043 3L area 3+2/3 single-GJM low-loss optimization
on:
  pull_request:
    branches: [main]
    paths:
      - experiments/chatgpt_topology_search/runs/EXP-043/refine_one_gjm_cp.py
      - .github/workflows/exp043_one_gjm_cp_refinement.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  improve:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - variant: baseline
            starts: 10
          - variant: cv0_bridge_input
            starts: 3
          - variant: cv0_bridge_output
            starts: 3
          - variant: cv2_input_output
            starts: 3
          - variant: cv1_shunt_inductor
            starts: 3
          - variant: cf0_input_to_tip
            starts: 3
          - variant: cf1_output_to_tip
            starts: 3
          - variant: cf1_out_ground
            starts: 3
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Verify central reservation EXP-043 on main
        run: |
          git fetch origin main --depth=1
          python scripts/experiment_id_registry.py --experiment-id EXP-043 --owner MasayaTakagi --main-ref origin/main
      - run: uv sync --frozen
      - name: Multi-start RF-T005 minimax and independent 7x7 MNA
        run: |
          mkdir -p results/EXP-043
          set +e
          uv run --frozen python experiments/chatgpt_topology_search/runs/EXP-043/refine_one_gjm_cp.py \
            --variant ${{ matrix.variant }} --starts ${{ matrix.starts }} \
            --coarse 9 --refine 31 --dense 1001 --maxiter 175 \
            --target 30.02 --seed 20261017 \
            --out results/EXP-043/low_loss_${{ matrix.variant }}.json \
            >results/EXP-043/stdout_${{ matrix.variant }}.txt \
            2>results/EXP-043/stderr_${{ matrix.variant }}.txt
          code=$?
          cat results/EXP-043/stdout_${{ matrix.variant }}.txt
          cat results/EXP-043/stderr_${{ matrix.variant }}.txt
          echo "exit_code=$code" >results/EXP-043/exit_${{ matrix.variant }}.txt
          exit $code
      - name: Preserve full vector, solver history and logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp043-area3p667-low-loss-${{ matrix.variant }}
          path: |
            results/EXP-043/low_loss_${{ matrix.variant }}.json
            results/EXP-043/stdout_${{ matrix.variant }}.txt
            results/EXP-043/stderr_${{ matrix.variant }}.txt
            results/EXP-043/exit_${{ matrix.variant }}.txt
          if-no-files-found: warn
