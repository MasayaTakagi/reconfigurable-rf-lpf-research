name: Phase 2 EXP-009 variable-C topology sweep

on:
  workflow_dispatch:
    inputs:
      starts:
        description: Multistart attempts for each constrained circuit graph
        required: true
        type: choice
        options: ["1", "2", "4"]
        default: "2"
      iterations:
        description: Maximum SLSQP iterations per start
        required: true
        type: choice
        options: ["120", "300", "600"]
        default: "300"
      max_new_jobs_per_shard:
        description: New graph families per shard in this invocation
        required: true
        type: choice
        options: ["1", "3", "5"]
        default: "3"
      resume_run_id:
        description: Prior run ID with matching source/parameter checkpoint artifacts, optional
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: phase2-exp009-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - run: echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Check EXP009 saved candidate regression and MNA
        run: |
          python experiments/chatgpt_topology_search/runs/EXP-009/verify.py
          python experiments/chatgpt_topology_search/runs/EXP-009/sweep.py --reference-only

  optimize:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard_index: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - run: echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Prepare shard checkpoint
        run: mkdir -p results/exp009/shard-${{ matrix.shard_index }}
      - name: Check prior-run artifact
        id: resume
        if: ${{ inputs.resume_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/check_p4_a_artifact.py
          --run-id "${{ inputs.resume_run_id }}"
          --artifact-name "exp009-shard-${{ matrix.shard_index }}"
      - name: Restore matching shard checkpoint
        if: ${{ inputs.resume_run_id != '' && steps.resume.outputs.found == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: exp009-shard-${{ matrix.shard_index }}
          path: results/exp009/shard-${{ matrix.shard_index }}
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ github.token }}
      - name: Run deterministic multi-start local topology search
        run: |
          python experiments/chatgpt_topology_search/runs/EXP-009/sweep.py \
            --shard-count 8 \
            --shard-index "${{ matrix.shard_index }}" \
            --max-new-jobs "${{ inputs.max_new_jobs_per_shard }}" \
            --starts "${{ inputs.starts }}" \
            --maxiter "${{ inputs.iterations }}" \
            --points 17 \
            --verify-points 201 \
            --atten 30.05 \
            --seed 20261012 \
            --checkpoint "results/exp009/shard-${{ matrix.shard_index }}/checkpoint.json"
      - name: Preserve checkpoint and partial results on failure
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: exp009-shard-${{ matrix.shard_index }}
          path: results/exp009/shard-${{ matrix.shard_index }}/
          if-no-files-found: warn
          retention-days: 14

  summarize:
    needs: [preflight, optimize]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download available shard checkpoints
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: exp009-shard-*
          path: results/exp009/shards
          merge-multiple: false
      - name: Explicitly count incomplete, failed, or missing graph work
        run: |
          python experiments/chatgpt_topology_search/runs/EXP-009/aggregate.py \
            --input-dir results/exp009/shards \
            --expected-shards 8 \
            --output results/exp009/summary.json
      - name: Save summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp009-summary-${{ github.run_id }}
          path: results/exp009/summary.json
          if-no-files-found: warn
          retention-days: 14
