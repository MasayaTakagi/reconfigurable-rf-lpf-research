name: Phase 2 W4 run and workflow source forensics

on:
  pull_request:
    paths:
      - 'scripts/review_phase2_w4_unindexed.py'
      - 'scripts/review_phase2_w4_action_runs.py'
      - '.github/workflows/phase2_cleanup_w4_run_forensics.yml'
      - 'docs/phase2_cleanup_w4_forensics_20261017.md'
      - 'data/repository_reviews/w4_*_20261017.csv'
      - 'data/repository_reviews/w4_run_forensics_20261017.json'
      - 'docs/roadmap.md'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  source-and-run-history:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 46 originals and zero deletions in W4
        run: python3 scripts/audit_phase2_cleanup_w4.py --output-dir artifacts/phase2_reports/w4/base
      - name: Classify all 225 previously unindexed evidence files by source and reference
        run: |
          python3 scripts/review_phase2_w4_unindexed.py \
            --output-dir artifacts/phase2_reports/w4/forensics \
            --emit-review-csv-chunks
      - name: Verify full 225-source CSV reproduces committed review
        run: cmp artifacts/phase2_reports/w4/forensics/w4_unindexed_225_review.csv data/repository_reviews/w4_unindexed_225_review_20261017.csv
      - name: Query GitHub Actions API for the 39 original workflows
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/review_phase2_w4_action_runs.py \
            --output-dir artifacts/phase2_reports/w4/forensics \
            --emit-csv-chunks
      - name: Verify saved workflow run history snapshot retains all original 39 paths
        run: |
          python3 - <<'PY'
          import csv, json, subprocess
          from pathlib import Path
          base='26cacd179146bda5f5ca1cdcf0096dd61eb4faae'
          original = set(subprocess.check_output(
              ['git','ls-tree','-r','--name-only',base,'.github/workflows/'],
              text=True).splitlines())
          with Path('data/repository_reviews/w4_workflow_runs_20261017.csv').open(newline='') as f:
              rows=list(csv.DictReader(f))
          assert len(original)==len(rows)==39
          assert {r['workflow_path'] for r in rows} == original
          assert all(r['workflow_id'] and r['owner_delete_approval']=='not_granted'
                     and r['deletion_executed']=='false' for r in rows)
          snapshot=json.loads(Path('data/repository_reviews/w4_run_forensics_20261017.json').read_text())
          assert snapshot['source_summary']['unindexed_count']==225
          assert snapshot['workflow_history_summary']['workflow_paths_reviewed']==39
          assert snapshot['deletion_count']==0
          print('W4 snapshot PASS: 225 reviewed, 39 workflow identities retained; no deletion')
          PY
      - name: Check all tracked Markdown local links
        run: python3 scripts/verify_phase2_cleanup_w1_links.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase2-w4-per-file-and-run-history-evidence
          path: artifacts/phase2_reports/w4/
          if-no-files-found: warn
          retention-days: 30
