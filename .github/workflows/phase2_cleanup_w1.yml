name: Phase 2 W1 documentation and link integrity

on:
  push:
    branches:
      - docs/phase2-w1-current-status-and-links-20261017
  pull_request:
    paths:
      - 'README.md'
      - 'docs/**/*.md'
      - 'data/README.md'
      - 'scripts/README.md'
      - 'experiments/**/*.md'
      - 'scripts/verify_phase2_cleanup_w1_links.py'
      - '.github/workflows/phase2_cleanup_w1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify all tracked Markdown links and current status labels
        run: python3 scripts/verify_phase2_cleanup_w1_links.py
      - name: No research source changes or deletions in W1
        run: |
          python3 - <<'PY'
          import subprocess
          baseline='055b222c79c73c7fbeacb19383f21c1da0625195'
          changed=subprocess.check_output(
              ['git','diff','--name-only',baseline,'HEAD'],text=True).splitlines()
          protected=('data/constraints/','data/parasitics/','data/validation/',
                     'data/bands.csv','data/design_constraints.json')
          assert not any(p.startswith(protected) for p in changed)
          assert not any(p.startswith('experiments/') and not p.endswith('README.md')
                         for p in changed)
          deleted=subprocess.check_output(
              ['git','diff','--diff-filter=D','--name-only',baseline,'HEAD'],text=True).splitlines()
          approved={
              'docs/repository_reorganization_plan.md',
              'docs/research_result_governance.md',
              'docs/phase2_actions_ci_repair_20261017.md',
              'docs/repository_storage_audit_20261014.md',
          }
          assert set(deleted).issubset(approved), deleted
          print('W1 PASS: no protected source changes; deletions limited to W3 approved historical documents')
          PY
