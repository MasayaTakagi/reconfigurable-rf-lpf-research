name: EXP-043 coupling coefficient vs 3pF C ceiling sensitivity
on:
  pull_request:
    branches: [main]
    paths:
      - experiments/chatgpt_topology_search/runs/EXP-043/diagnose_k_vs_C.py
      - .github/workflows/exp043_k_vs_c.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sensitivity:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Verify central reservation on main
        run: |
          git fetch origin main --depth=1
          python scripts/experiment_id_registry.py --experiment-id EXP-043 --owner MasayaTakagi --main-ref origin/main
      - run: uv sync --frozen
      - name: Diagnose fixed k and retune versus C maximum
        run: |
          uv run --frozen python experiments/chatgpt_topology_search/runs/EXP-043/diagnose_k_vs_C.py \
            --maxiter 180 --dense 1001 \
            --out results/EXP-043/k_vs_C.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp043-k-vs-C3-C4-diagnostic
          path: results/EXP-043/k_vs_C.json
          if-no-files-found: warn
