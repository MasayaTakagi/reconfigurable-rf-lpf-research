name: Phase 2 regression

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - run: echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - run: python scripts/audit_results.py
      - run: python scripts/audit_research_catalog.py
      - run: python scripts/verify_exp016_numpy2_replay.py
      - run: python scripts/audit_experiment_inventory.py
      - run: python scripts/audit_supplemental_evidence.py
      - run: python scripts/audit_validation_overlays.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/verify_no_pcb_tunable_candidates.py
