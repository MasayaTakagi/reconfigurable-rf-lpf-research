name: EXP-043 RF-T005 four-L exactly one-shunt control search

on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/chatgpt_topology_search/runs/EXP-043/search_4l_one_shunt.py'
      - '.github/workflows/exp043_4l_one_shunt.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search:
    name: one shunt L / ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant:
          - 4L_noGJM_caps
          - 4L_noGJM_bridge
          - 4L_oneGJM_ends
          - 4L_oneGJM_cross
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Preflight central reserved experiment and manifest
        run: |
          git fetch origin main --depth=1
          python scripts/experiment_id_registry.py --experiment-id EXP-043 --owner MasayaTakagi --main-ref origin/main
          python - <<'PY'
          import json
          from pathlib import Path
          f=Path("experiments/chatgpt_topology_search/runs/EXP-043/manifest.json")
          p=json.loads(f.read_text())
          assert p["phase"]=="Phase 2"
          assert p["constraints"]["constraint_id"]=="RF-T005"
          PY
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: Optimize 4L exactly one-shunt topology
        run: |
          uv run --frozen python experiments/chatgpt_topology_search/runs/EXP-043/search_4l_one_shunt.py \
            --variant ${{ matrix.variant }} --starts 4 --maxiter 140 --coarse 5 --dense 701 \
            --output results/EXP-043/${{ matrix.variant }}.json
      - name: Upload selected complete vector and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp043-${{ matrix.variant }}
          path: results/EXP-043/${{ matrix.variant }}.json
          if-no-files-found: warn
