name: Phase 2 Step 4 historical evidence inventory

on:
  push:
    branches:
      - docs/phase2-historical-evidence-step4-20261017
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  historical-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and pin original main research tree
        run: git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
      - name: Generate read-only historic indexes and review ledgers
        run: python3 scripts/audit_repository_reorganization_step4.py
      - name: Check deterministic audit data
        run: python3 scripts/audit_repository_reorganization_step4.py --check
      - name: Check cross-document link resolution and derived counts
        run: |
          python3 - <<'PY'
          import csv
          import json
          import re
          from pathlib import Path
          from urllib.parse import unquote
          import posixpath
          root = Path('.')
          s = json.loads(Path('data/repository_reviews/step4_summary_20261017.json').read_text())
          assert s['source_main_tracked_files'] == 1043
          assert s['source_main_document_count'] == 56
          assert s['identical_blob_groups'] == 34
          assert s['same_blob_extra_paths'] == 38
          assert s['retention_review_records'] == 46
          assert s['source_files_moved_or_deleted'] == 0
          failures = []
          docs = ['docs/archive/README.md', 'docs/methods/README.md',
                  'docs/governance/README.md',
                  'docs/phase2_repository_step4_review_20261017.md']
          for doc in docs:
              text = Path(doc).read_text(encoding='utf-8')
              for raw in re.findall(r'\]\(([^)]+)\)', text):
                  raw = unquote(raw.split('#', 1)[0].split('?', 1)[0])
                  if not raw or raw.startswith(('https://','http://','mailto:')):
                      continue
                  target = posixpath.normpath(posixpath.join(posixpath.dirname(doc), raw))
                  if not (root / target).exists():
                      failures.append((doc, target))
          assert not failures, failures
          with open('data/repository_reviews/step4_retention_46_20261017.csv') as f:
              rows = list(csv.DictReader(f))
          assert all(r['current_disposition'] == 'retain_pending_source_context_review'
                     for r in rows)
          print('PASS: Step 4 56 docs, 34 same-blob groups, 46 retained and links')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phase2-step4-history-and-retention
          path: |
            docs/archive/README.md
            docs/phase2_repository_step4_review_20261017.md
            data/repository_reviews/step4_*
          retention-days: 30
      - name: Save evidence catalogs to this review branch only
        if: github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/archive/README.md docs/phase2_repository_step4_review_20261017.md
          git add data/repository_reviews/step4_*
          if git diff --cached --quiet; then
            echo 'No audit changes'
          else
            git commit -m 'docs(audit): preserve non-destructive Step 4 evidence reviews [skip ci]'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
