name: EXP-042 RF-T005 4L bridge independent verification

on:
  pull_request:
    paths:
      - "experiments/chatgpt_topology_search/runs/EXP-042/**"
      - ".github/workflows/exp042-rf-t005-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - name: Check RF-T005 with fixed external S2P and independent MNA
        run: uv run python experiments/chatgpt_topology_search/runs/EXP-042/verify_rf_t005.py
