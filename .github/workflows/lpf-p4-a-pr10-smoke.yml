name: P4-A PR10 checkpoint compatibility smoke

on:
  push:
    branches:
      - docs/phase2-research-reorganization-20261011
  workflow_dispatch:

permissions:
  contents: read

# Deliberately small: 1 shard, 1 graph per run, 1 optimizer start/iteration.
# Separate jobs force a real GitHub Artifact upload/download across runners.
# Not a performance search, P4-A coverage test, or full LPF validation.
jobs:
  save:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env: &numerical_environment
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: mkdir -p results
      - name: Persist one graph into a checkpoint
        run: python experiments/matching_limit/p4_batch.py --attempts 1 --per-bin 1 --starts 1 --layouts 1 --iterations 1 --coarse-points 2 --validation-points 3 --seed 20261011 --shard-count 1 --shard-index 0 --checkpoint results/checkpoint.json --output results/result.json --max-graphs-per-batch 1 --max-batch-seconds 600
      - uses: actions/upload-artifact@v7
        with:
          name: first-checkpoint
          path: results/
          if-no-files-found: error
          retention-days: 14

  restore:
    needs: save
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env: *numerical_environment
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v7
        with:
          name: first-checkpoint
          path: results
      - name: Resume from downloaded artifact and persist one more graph
        run: python experiments/matching_limit/p4_batch.py --attempts 1 --per-bin 1 --starts 1 --layouts 1 --iterations 1 --coarse-points 2 --validation-points 3 --seed 20261011 --shard-count 1 --shard-index 0 --checkpoint results/checkpoint.json --output results/result.json --max-graphs-per-batch 1 --max-batch-seconds 600 --resume
      - name: Validate real resume accounting
        run: |
          python - <<'PY'
          import json
          with open('results/checkpoint.json') as f: p=json.load(f)
          assert p['resume_count'] == 1, p['resume_count']
          assert len(p['completed_graph_ids']) >= 2, p['completed_graph_ids']
          print('PASS: GitHub Artifact restored; two graph units completed on compatible sources')
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: second-checkpoint
          path: results/
          if-no-files-found: error
          retention-days: 14

  complete:
    needs: restore
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env: *numerical_environment
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v7
        with:
          name: second-checkpoint
          path: results
      - name: Resume remaining sampled graph
        run: python experiments/matching_limit/p4_batch.py --attempts 1 --per-bin 1 --starts 1 --layouts 1 --iterations 1 --coarse-points 2 --validation-points 3 --seed 20261011 --shard-count 1 --shard-index 0 --checkpoint results/checkpoint.json --output results/result.json --max-graphs-per-batch 1 --max-batch-seconds 600 --resume
      - name: Verify no graph work remains
        run: |
          python - <<'PY'
          import json
          with open('results/checkpoint.json') as f: p=json.load(f)
          assert p['resume_count'] == 2, p['resume_count']
          assert p['status'] == 'completed', p['status']
          assert not p['remaining_graph_ids'], p['remaining_graph_ids']
          assert len(p['completed_graph_ids']) == len(p['expected_graph_ids'])
          print('PASS: artifact-backed continuation completed declared small sample')
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: completed-checkpoint
          path: results/
          if-no-files-found: error
          retention-days: 14
