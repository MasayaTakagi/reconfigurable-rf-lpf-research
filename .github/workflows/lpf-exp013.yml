name: Phase 2 EXP013 cost4 manual topology exploration
on:
  workflow_dispatch:
    inputs:
      family:
        type: choice
        required: true
        options:
          - pcb3
          - pcb2_all
          - physical_row
          - ind1
          - indpair_main
          - var3
        default: pcb2_all
      starts:
        type: number
        required: true
        default: 3
      points:
        type: number
        required: true
        default: 31
      maxiter:
        type: number
        required: true
        default: 200
      rejection:
        type: number
        required: true
        default: 30.002
permissions:
  contents: read
jobs:
  sharded-local-search:
    runs-on: ubuntu-latest
    timeout-minutes: 220
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run one topology shard
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results/exp013
          # Shards use disjoint job indices, rather than silently dropping remaining work.
          python - <<'PY'
          import os,sys,json
          from pathlib import Path
          base=Path('experiments/chatgpt_topology_search/runs/EXP-013')
          sys.path.insert(0,str(base))
          from sweep import makejobs
          family='${{ inputs.family }}';shard=${{ matrix.shard }}
          total=len(makejobs(family))
          lo=(total*shard)//4;hi=(total*(shard+1))//4
          print('shard',shard,'family',family,'total_jobs',total,'start',lo,'end',hi,flush=True)
          # Avoid shell expansion ambiguities by subprocess argv.
          import subprocess
          subprocess.run(['python',str(base/'sweep.py'),'--group',family,'--first',str(lo),'--last',str(hi),'--starts','${{ inputs.starts }}','--grid','${{ inputs.points }}','--maxiter','${{ inputs.maxiter }}','--target','${{ inputs.rejection }}','--out',f'results/exp013/{family}_shard{shard}.jsonl'],check=True)
          PY
      - name: Preserve outputs even when a step fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp013-${{ inputs.family }}-shard${{ matrix.shard }}
          path: results/exp013/*.jsonl
          if-no-files-found: warn
          retention-days: 30