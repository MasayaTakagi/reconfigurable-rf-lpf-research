name: EXP-042 RF-T005 chip-area sweep
on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/chatgpt_topology_search/runs/EXP-042/**'
      - '.github/workflows/exp042_area.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  area:
    name: area / ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        variant: [cf1, cf2, both]
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Verify EXP-042 main reservation
        run: |
          git fetch origin main --depth=1
          python scripts/experiment_id_registry.py --experiment-id EXP-042 --owner MasayaTakagi --main-ref origin/main
      - name: Install locked numerical environment
        run: uv sync --frozen
      - name: Minimize IL with fewer GJM fixed capacitors
        run: |
          uv run --frozen python experiments/chatgpt_topology_search/runs/EXP-042/optimize_area.py \
            --variant ${{ matrix.variant }} --target 30.02 \
            --starts 3 --maxiter 210 --grid 9 --dense 1001 \
            --out results/EXP-042/area_${{ matrix.variant }}.json
      - name: Independent branch-current MNA and power conservation
        run: |
          uv run --frozen python experiments/chatgpt_topology_search/runs/EXP-042/verify_area.py \
            --result results/EXP-042/area_${{ matrix.variant }}.json
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp042-area-${{ matrix.variant }}
          path: results/EXP-042/area_${{ matrix.variant }}*.json
          if-no-files-found: warn
