name: EXP-042 provenance bootstrap
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/bootstrap_exp042_manifest.py'
      - '.github/workflows/exp042_manifest.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  manifest:
    if: github.head_ref == 'research/exp042-rft005-c-h30p0002'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/exp042-rft005-c-h30p0002
          persist-credentials: true
      - uses: astral-sh/setup-uv@v6
      - name: Verify main experiment number reservation
        run: |
          git fetch origin main --depth=1
          python scripts/experiment_id_registry.py --experiment-id EXP-042 --owner MasayaTakagi --main-ref origin/main
      - name: Resolve RF-T005 and regenerate provenance
        run: |
          uv sync --frozen
          uv run --frozen python scripts/bootstrap_exp042_manifest.py
          uv run --frozen python scripts/audit_results.py
          python scripts/audit_experiment_number_registry.py --main-ref origin/main
      - name: Commit generated manifest and experiment index on research branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/chatgpt_topology_search/runs/EXP-042/manifest.json data/experiment_index.csv
          if ! git diff --cached --quiet; then
            git commit -m 'EXP-042 add resolved RF-T005 provenance and canonical index'
            git push origin HEAD:refs/heads/research/exp042-rft005-c-h30p0002
          fi
