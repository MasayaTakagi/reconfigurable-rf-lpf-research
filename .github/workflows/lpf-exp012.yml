name: "Phase 2 EXP012 cost / two-tunable finite topology search"
on:
  workflow_dispatch:
    inputs:
      family:
        description: "Finite topology family (default all 2-C edge pairs)"
        required: true
        type: choice
        options:
          - two_cv_all_edges
          - two_cv_fixed_rewire
          - two_cv_two_gjm
          - two_ground
          - three_l_three_cv
          - zero_gjm_three_cv
      starts:
        description: "Local solver initializations per graph"
        type: number
        required: true
        default: 4
      grid:
        description: "Optimization samples per individual frequency interval"
        type: number
        required: true
        default: 31
      iterations:
        description: "SLSQP max iterations per initialization"
        type: number
        required: true
        default: 260
permissions:
  contents: read
jobs:
  topology-search:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked numerical requirements
        run: uv sync --frozen
      - run: echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Run manually sharded local nonconvex search
        env:
          OPENBLAS_NUM_THREADS: "1"
        run: |
          python experiments/chatgpt_topology_search/runs/EXP-012/search_cost.py \
            --mode '${{ inputs.family }}' --starts '${{ inputs.starts }}' \
            --grid '${{ inputs.grid }}' --maxiter '${{ inputs.iterations }}' \
            --shards 4 --shard-index '${{ matrix.shard }}' \
            --checkpoint 'results/exp012/${{ inputs.family }}/shard_${{ matrix.shard }}.json'
      - name: Save partial and successful results even on solver failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp012-${{ inputs.family }}-${{ matrix.shard }}
          path: results/exp012/${{ inputs.family }}/shard_${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 14