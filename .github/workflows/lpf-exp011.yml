name: Phase 2 EXP-011 compact LPF local topology search
on:
  workflow_dispatch:
    inputs:
      family:
        type: choice
        description: Candidate graph family for short bounded search
        options: [fixed_gjm, var3, pcb1, gjm2, ind_edges, baseline]
        default: gjm2
        required: true
      starts:
        type: choice
        options: ['1', '2', '4', '8']
        default: '4'
        required: true
      iterations:
        type: choice
        options: ['100', '180', '350']
        default: '180'
        required: true
      jobs_per_shard:
        type: choice
        options: ['1', '3', '6', '15']
        default: '6'
        required: true
      resume_run_id:
        type: string
        required: false
        description: Optional prior run ID containing matching checkpoints
permissions:
  contents: read
  actions: read
concurrency:
  group: exp011-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - run: echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - run: uv run --frozen python -m unittest discover -s tests -p 'test_exp011.py' -v
  search:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard_index: [0, 1, 2, 3]
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - run: echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - run: mkdir -p results/exp011/shard-${{ matrix.shard_index }}
      - name: Check prior-run artifact
        if: ${{ inputs.resume_run_id != '' }}
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/check_p4_a_artifact.py
          --run-id "${{ inputs.resume_run_id }}"
          --artifact-name "exp011-shard-${{ matrix.shard_index }}"
      - name: Restore matching checkpoints
        if: ${{ inputs.resume_run_id != '' && steps.previous.outputs.found == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: exp011-shard-${{ matrix.shard_index }}
          path: results/exp011/shard-${{ matrix.shard_index }}
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ github.token }}
      - name: Execute bounded new work and save after every graph
        run: |
          python experiments/chatgpt_topology_search/runs/EXP-011/compact_search.py \
            --family '${{ inputs.family }}' \
            --starts '${{ inputs.starts }}' \
            --iterations '${{ inputs.iterations }}' \
            --max-new-jobs '${{ inputs.jobs_per_shard }}' \
            --shards 4 --shard-index '${{ matrix.shard_index }}' \
            --points 31 --rejection 30.005 --seed 20261012 \
            --checkpoint 'results/exp011/shard-${{ matrix.shard_index }}/checkpoint.json'
      - name: Persist partial/failed checkpoints
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: exp011-shard-${{ matrix.shard_index }}
          path: results/exp011/shard-${{ matrix.shard_index }}/
          retention-days: 14
          if-no-files-found: warn
  summarize:
    needs: [preflight,search]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: exp011-shard-*
          path: results/exp011/shards
      - name: Summarize with explicit incomplete/failed/missing counts
        run: |
          python experiments/chatgpt_topology_search/runs/EXP-011/aggregate.py \
            --input-dir results/exp011/shards \
            --output results/exp011/summary.json \
            --shards 4
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: exp011-summary-${{ github.run_id }}
          path: results/exp011/summary.json
          if-no-files-found: warn