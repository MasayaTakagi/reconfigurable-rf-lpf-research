name: Phase 2 W2 topology search provenance

on:
  push:
    branches:
      - feat/phase2-w2-topology-search-20261017
  pull_request:
    paths:
      - '.github/workflows/phase2_cleanup_w2.yml'
      - 'scripts/build_phase2_candidate_topology_search.py'
      - 'data/catalog/phase2_candidate_topology_search_20261017*'
      - 'docs/results/phase2_candidate_topology_search_20261017.md'
      - 'tests/test_phase2_candidate_topology_search.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-pinned-structural-index:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify immutable 24-candidate catalog inputs
        run: python3 scripts/build_phase2_candidate_catalog.py --check
      - name: Verify committed W2 output before any regeneration
        if: github.event_name != 'push'
        run: python3 scripts/build_phase2_candidate_topology_search.py --check
      - name: Verify exact derived output
        run: python3 scripts/build_phase2_candidate_topology_search.py --check
      - name: Verify signed k, unknowns, and immutable Git blobs
        run: python3 -m unittest discover -s tests -p 'test_phase2_candidate_topology_search.py' -v
  publish-reviewed-snapshot:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check historical input catalog
        run: python3 scripts/build_phase2_candidate_catalog.py --check
      - name: Generate isolated W2 search output
        run: python3 scripts/build_phase2_candidate_topology_search.py
      - name: Check new output and regression before commit
        run: |
          python3 scripts/build_phase2_candidate_topology_search.py --check
          python3 -m unittest discover -s tests -p 'test_phase2_candidate_topology_search.py' -v
      - name: Save generated W2 records to review branch only
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog/phase2_candidate_topology_search_20261017.csv
          git add data/catalog/phase2_candidate_topology_search_20261017_summary.json
          git add docs/results/phase2_candidate_topology_search_20261017.md
          if git diff --cached --quiet; then
            echo "W2 outputs are current"
          else
            git commit -m "data(w2): preserve 24-row source-pinned structural-search results [skip ci]"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
          fi
