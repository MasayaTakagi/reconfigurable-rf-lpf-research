name: EXP-043 independent 3L branch-current MNA validation
on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/chatgpt_topology_search/runs/EXP-043/verify_3l.py'
      - '.github/workflows/exp043_verify_3l.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        variant: [zero_gjm_double, two_gjm_bridge]
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: 7x7 independent branch-current MNA and power conservation
        run: |
          uv run --frozen python experiments/chatgpt_topology_search/runs/EXP-043/verify_3l.py \
            --checkpoint experiments/chatgpt_topology_search/runs/EXP-043/checkpoints/${{ matrix.variant }}.json \
            --points 3
