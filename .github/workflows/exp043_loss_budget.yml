name: EXP-043 point-frequency passband power loss decomposition
on:
  pull_request:
    branches: [main]
    paths:
      - experiments/chatgpt_topology_search/runs/EXP-043/analyze_loss_budget.py
      - .github/workflows/exp043_loss_budget.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  budget:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Verify main reservation
        run: |
          git fetch origin main --depth=1
          python scripts/experiment_id_registry.py --experiment-id EXP-043 --owner MasayaTakagi --main-ref origin/main
      - run: uv sync --frozen
      - name: Independent power budget at B28 and B8 pass-edge
        run: |
          uv run --frozen python experiments/chatgpt_topology_search/runs/EXP-043/analyze_loss_budget.py \
            --out results/EXP-043/loss_budget.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp043-loss-budget
          path: results/EXP-043/loss_budget.json
          if-no-files-found: warn
