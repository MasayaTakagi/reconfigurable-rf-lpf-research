name: Phase 2 regression

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: phase2-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - run: echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - run: python scripts/audit_results.py
      - run: python scripts/audit_research_catalog.py
      - run: python scripts/verify_exp016_numpy2_replay.py
      - run: python scripts/audit_experiment_inventory.py
      - run: python scripts/audit_supplemental_evidence.py
      - run: python scripts/audit_validation_overlays.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/verify_no_pcb_tunable_candidates.py
      - name: Build read-only storage reference inventory
        run: |
          python scripts/build_reference_inventory.py --csv artifacts/phase2_reports/reference_inventory.csv --summary artifacts/phase2_reports/reference_summary.json
      - name: Build condition-separated Pareto reports
        run: |
          python scripts/report_research_pareto.py --csv artifacts/phase2_reports/pareto_candidates.csv --summary artifacts/phase2_reports/pareto_summary.json --markdown artifacts/phase2_reports/pareto.md
      - run: python scripts/verify_archived_evidence_packages.py --summary artifacts/phase2_reports/archive_integrity_summary.json
      - name: Triage non-indexed research evidence (no deletion)
        run: |
          python scripts/triage_unlinked_evidence.py --csv artifacts/phase2_reports/storage_triage.csv --summary artifacts/phase2_reports/storage_triage_summary.json --check
      - name: Report Phase 2 metadata completeness (source only)
        run: |
          python scripts/report_experiment_metadata_gaps.py --csv artifacts/phase2_reports/experiment_metadata_gaps.csv --summary artifacts/phase2_reports/experiment_metadata_summary.json
      - name: Audit retained merged-PR branch heads (read only)
        run: |
          git fetch --no-tags --depth=1 origin '+refs/heads/*:refs/remotes/origin/*'
          python scripts/audit_branch_retention.py --report artifacts/phase2_reports/branch_retention_summary.json --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase2-storage-and-pareto-reports
          path: artifacts/phase2_reports/
          if-no-files-found: warn
          retention-days: 30

  history-backup:
    # A temporary restore-tested backup, not authorization to delete branches.
    # This narrow PR-only run does not enlarge every future main/PR audit.
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 53
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fetch all current branch refs with full ancestry
        run: git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
      - name: Create full backup and verify independent restore
        run: |
          python scripts/backup_complete_git_history.py --output artifacts/phase2_git_history/phase2-all-branches.bundle --manifest artifacts/phase2_git_history/phase2-all-branches-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: phase2-complete-git-history
          path: artifacts/phase2_git_history/
          if-no-files-found: error
          retention-days: 90
