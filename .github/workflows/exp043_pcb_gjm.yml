name: EXP-043 RF-T005 PCB C ceiling versus GJM Q80 replacement
on:
  pull_request:
    branches: [main]
    paths:
      - experiments/chatgpt_topology_search/runs/EXP-043/diagnose_pcb_gjm.py
      - .github/workflows/exp043_pcb_gjm.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    name: ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        variant:
          - baseline
          - pcb_0p3_OFFSPEC
          - pcb_0p5_OFFSPEC
          - gjm_cf0
          - gjm_cf1
          - gjm_cp
          - gjm_cf0_cf1
          - gjm_cf0_cp
          - gjm_cf1_cp
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Verify main experiment reservation
        run: |
          git fetch origin main --depth=1
          python scripts/experiment_id_registry.py --experiment-id EXP-043 --owner MasayaTakagi --main-ref origin/main
      - name: Use pinned numerical environment
        run: uv sync --frozen
      - name: Retune L C k and validate full externally terminated S2P
        run: |
          uv run --frozen python experiments/chatgpt_topology_search/runs/EXP-043/diagnose_pcb_gjm.py \
            --variant ${{ matrix.variant }} --starts 4 --maxiter 220 --coarse 9 --dense 1001 \
            --out results/EXP-043/pcb_vs_gjm_${{ matrix.variant }}.json
      - name: Preserve complete results and independent-MNA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp043-pcb-gjm-${{ matrix.variant }}
          path: results/EXP-043/pcb_vs_gjm_${{ matrix.variant }}.json
          if-no-files-found: warn
