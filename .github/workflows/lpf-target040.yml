name: Phase 2 target 0.40dB topology sweep

on:
  workflow_dispatch:
    inputs:
      starts:
        description: Multistart attempts for each graph
        required: true
        type: choice
        options: ["1", "2", "4"]
        default: "2"
      iterations:
        description: Maximum L-BFGS-B iterations per start
        required: true
        type: choice
        options: ["80", "160", "300"]
        default: "160"
      new_jobs_per_shard:
        description: New graph families per shard during this run
        required: true
        type: choice
        options: ["2", "4", "12", "35"]
        default: "4"
      resume_run_id:
        description: Optional previous run ID with checkpoint artifacts (same source/params)
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: phase2-target040-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Check policy and reference data
        run: |
          python scripts/audit_results.py
          python -m unittest tests.test_target040_vector_engine -v
          python experiments/chatgpt_topology_search/runs/EXP-004/sweep_040.py --reference-only

  optimize:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      max-parallel: 4
      fail-fast: false
      matrix:
        shard_index: [0, 1, 2, 3]
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install scientific dependencies
        run: python -m pip install -r requirements.txt
      - name: Prepare checkpoint directory
        run: mkdir -p "results/target040/shard-${{ matrix.shard_index }}"
      - name: Find prior-run checkpoint
        id: check
        if: ${{ inputs.resume_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          OLD_RUN_ID: ${{ inputs.resume_run_id }}
        run: >-
          python scripts/check_p4_a_artifact.py
          --run-id "$OLD_RUN_ID"
          --artifact-name "phase2-target040-shard-${{ matrix.shard_index }}"
      - name: Restore checkpoint artifact if available
        if: ${{ inputs.resume_run_id != '' && steps.check.outputs.found == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: phase2-target040-shard-${{ matrix.shard_index }}
          path: results/target040/shard-${{ matrix.shard_index }}
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ github.token }}
      - name: Run selected new graph optimizations and checkpoint after every graph
        run: |
          python experiments/chatgpt_topology_search/runs/EXP-004/sweep_040.py \
            --shard-count 4 \
            --shard-index "${{ matrix.shard_index }}" \
            --starts "${{ inputs.starts }}" \
            --iterations "${{ inputs.iterations }}" \
            --max-new-jobs "${{ inputs.new_jobs_per_shard }}" \
            --coarse-points 3 \
            --verification-points 13 \
            --atten 35.07 \
            --seed 20261011 \
            --checkpoint "results/target040/shard-${{ matrix.shard_index }}/checkpoint.json"
      - name: Save checkpoints and partial results even if optimization fails
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: phase2-target040-shard-${{ matrix.shard_index }}
          path: results/target040/shard-${{ matrix.shard_index }}/
          if-no-files-found: warn
          retention-days: 14

  summarize:
    if: always()
    needs: [preflight,optimize]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download all available shard artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: phase2-target040-shard-*
          path: results/target040/shards
          merge-multiple: false
      - name: Report completion without falsely claiming exhaustive exploration
        run: |
          python experiments/chatgpt_topology_search/runs/EXP-004/summarize.py \
            --input-dir results/target040/shards \
            --output results/target040/summary.json
      - name: Archive aggregate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-target040-summary-${{ github.run_id }}
          path: results/target040/summary.json
          if-no-files-found: warn
          retention-days: 14
