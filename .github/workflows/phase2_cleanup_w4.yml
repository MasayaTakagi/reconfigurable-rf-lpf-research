name: Phase 2 W4 evidence and workflow disposition audit

on:
  pull_request:
    paths:
      - 'scripts/audit_phase2_cleanup_w4.py'
      - '.github/workflows/phase2_cleanup_w4.yml'
      - 'docs/phase2_cleanup_w4_evidence_workflow_review_20261017.md'
      - 'data/repository_reviews/w4_cleanup_decision_gates_20261017.csv'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit current tracked experiment evidence and workflow dependencies without removal
        run: python3 scripts/audit_phase2_cleanup_w4.py --output-dir artifacts/phase2_reports/w4
      - name: Check existing tracked Markdown link integrity
        run: python3 scripts/verify_phase2_cleanup_w1_links.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase2-w4-review-only-reports
          path: artifacts/phase2_reports/w4/
          if-no-files-found: warn
          retention-days: 30
