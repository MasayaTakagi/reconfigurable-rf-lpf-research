name: One-time orphan branch archive and cleanup
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-orphan-branch-cleanup.yml'
permissions:
  contents: write
  pull-requests: read
jobs:
  prune-merged-pr-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Remove post-squash integration branch with SHA lease
        uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            const branch="maintenance/consolidate-orphan-screening-20261012";
            const expected="7b524b3a12ed272bd4837e8825ab4bd273dae05d";
            const {data:pr}=await github.rest.pulls.get({owner,repo,pull_number:14});
            if (!pr.merged || pr.head.sha!==expected || pr.base.ref!=="main") throw new Error("PR #14 merge and head revision do not match");
            const {data:doc}=await github.rest.repos.getContent({owner,repo,path:"docs/historical_results.md",ref:"main"});
            const archive=Buffer.from(doc.content,"base64").toString("utf8");
            if(!archive.includes("0.1319912168")||!archive.includes("6506e836ed3495614e1ffa447b4ad4cd01f188e7")) throw new Error("Archived study was not found in main");
            const tag=await github.rest.git.getRef({owner,repo,ref:"tags/archive/matching-midpoint-cap-screen-20261010"});
            if(tag.data.object.sha!=="6506e836ed3495614e1ffa447b4ad4cd01f188e7") throw new Error("Archive tag missing or changed");
            const {data:br}=await github.rest.repos.getBranch({owner,repo,branch});
            if(br.protected||br.commit.sha!==expected) throw new Error("Unexpected branch revision or protection");
            const {data:open}=await github.rest.pulls.list({owner,repo,state:"open",per_page:100});
            if(open.some(p=>p.head.repo?.full_name===owner+"/"+repo&&p.head.ref===branch)) throw new Error("Branch is used by open PR");
            await github.rest.git.deleteRef({owner,repo,ref:"heads/"+branch});
            core.info("Removed squashed-merged PR #14 branch after verifying archive and SHA");
