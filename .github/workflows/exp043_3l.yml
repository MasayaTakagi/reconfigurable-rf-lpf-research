name: EXP-043 RF-T005 3L single-shunt multimode search

on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/chatgpt_topology_search/runs/EXP-043/search_3l.py'
      - '.github/workflows/exp043_3l.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search:
    name: 3L / ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant:
          - two_gjm_bridge
          - two_gjm_fork
          - one_gjm_bridge
          - one_gjm_fork
          - one_gjm_tap
          - zero_gjm_double
          - zero_gjm_bridge
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Verify reservation and pre-execution manifest
        run: |
          git fetch origin main --depth=1
          python scripts/experiment_id_registry.py --experiment-id EXP-043 --owner MasayaTakagi --main-ref origin/main
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("experiments/chatgpt_topology_search/runs/EXP-043/manifest.json").read_text())
          assert x["experiment_id"]=="EXP-043" and x["constraints"]["constraint_id"]=="RF-T005"
          assert x["execution"]["status"]=="planned"
          print("Preflight EXP-043 manifest PASS")
          PY
      - name: Install frozen environment
        run: uv sync --frozen
      - name: Search candidate topology
        run: |
          uv run --frozen python experiments/chatgpt_topology_search/runs/EXP-043/search_3l.py \
            --variant ${{ matrix.variant }} --starts 4 --maxiter 140 --coarse 5 --dense 701 \
            --seed 20261015 \
            --output results/EXP-043/${{ matrix.variant }}.json
      - name: Preserve complete vectors and numerical outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp043-${{ matrix.variant }}
          path: results/EXP-043/${{ matrix.variant }}.json
          if-no-files-found: warn
