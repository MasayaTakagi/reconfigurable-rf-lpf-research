name: EXP-043 passband Q of coupled L versus actual power loss
on:
  pull_request:
    branches: [main]
    paths:
      - experiments/chatgpt_topology_search/runs/EXP-043/analyze_passband_q.py
      - .github/workflows/exp043_passband_q.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Verify EXP-043 central main reservation
        run: |
          git fetch origin main --depth=1
          python scripts/experiment_id_registry.py --experiment-id EXP-043 --owner MasayaTakagi --main-ref origin/main
      - run: uv sync --frozen
      - name: Compute magnetic Q and independent passband power balance
        run: |
          uv run --frozen python experiments/chatgpt_topology_search/runs/EXP-043/analyze_passband_q.py \
            --out results/EXP-043/passband_effective_q.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp043-passband-effective-L-Q-and-power
          path: results/EXP-043/passband_effective_q.json
          if-no-files-found: warn
