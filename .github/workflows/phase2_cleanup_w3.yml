name: Phase 2 W3 original-document preservation review

on:
  pull_request:
    paths:
      - 'docs/phase2_cleanup_w3_document_review_20261017.md'
      - 'data/repository_reviews/w3_document_disposition_20261017.csv'
      - 'scripts/verify_phase2_cleanup_w3.py'
      - '.github/workflows/phase2_cleanup_w3.yml'
      - 'docs/README.md'
      - 'docs/roadmap.md'
      - 'docs/current/*.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-preservation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify seven source blobs and actual git-show recoverability
        run: python3 scripts/verify_phase2_cleanup_w3.py
      - name: Check all tracked Markdown local links and RF source integrity
        run: python3 scripts/verify_phase2_cleanup_w1_links.py
