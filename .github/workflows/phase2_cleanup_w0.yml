name: Phase 2 cleanup W0 pinned main audit

on:
  push:
    branches:
      - audit/phase2-w0-cleanup-baseline-20261017
  pull_request:
    branches:
      - docs/phase2-cleanup-deletion-plan-20261017
    paths:
      - '.github/workflows/phase2_cleanup_w0.yml'
      - 'scripts/audit_phase2_cleanup_w0_*.py'
      - 'data/repository_audits/w0_20261017_*'
      - 'data/repository_reviews/w0_cleanup_20261017_*'
      - 'docs/phase2_cleanup_w0_current_main_audit_20261017.md'
      - 'data/repository_reviews/phase2_cleanup_deletion_candidates_20261017.csv'
  workflow_dispatch:

jobs:
  regenerate-and-record:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild baseline using fixed main SHA
        run: |
          python scripts/audit_phase2_cleanup_w0_tree.py
          python scripts/audit_phase2_cleanup_w0_links.py
          python scripts/audit_phase2_cleanup_w0_links.py --check
      - name: Preserve review artifacts on this audit branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/repository_audits/w0_20261017_report.md
          git add docs/phase2_cleanup_w0_current_main_audit_20261017.md
          git add data/repository_audits/w0_20261017_*
          git add data/repository_reviews/w0_cleanup_20261017_*
          if git diff --cached --quiet; then
            echo 'No generated changes'
          else
            git commit -m 'data(w0): record verified read-only main inventory and deletion review [skip ci]'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
  verify-committed-evidence:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check W0 fixed-baseline output without mutating committed files
        run: |
          python scripts/audit_phase2_cleanup_w0_links.py --check
          python - <<'PY'
          import json
          from pathlib import Path
          summary=json.loads(Path('data/repository_reviews/w0_cleanup_20261017_summary.json').read_text())
          tree=json.loads(Path('data/repository_audits/w0_20261017_summary.json').read_text())
          assert summary['source_main_sha'] if 'source_main_sha' in summary else summary['base_main_sha'] == tree['main_sha']
          assert summary['tracked_paths'] == tree['tracked_entries']
          assert summary['protected_old_files_verified'] == 46
          assert summary['executed_deletions'] == 0
          print('W0 PASS: fixed main, Markdown survey, 46 protected files, no deletion')
          PY
