name: EXP-044 RF-T005 coupled pi 3L search
on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/chatgpt_topology_search/runs/EXP-044/**'
      - '.github/workflows/exp044_pi3l.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search:
    name: pi3L / ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        variant:
          - two_gjm_pi
          - one_gjm_pi
          - zero_gjm_pi
          - two_gjm_cross
          - one_gjm_cross
          - two_gjm_fork
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Verify EXP-044 reservation is on current main
        run: |
          git fetch origin main --depth=1
          python scripts/experiment_id_registry.py --experiment-id EXP-044 --owner MasayaTakagi --main-ref origin/main
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("experiments/chatgpt_topology_search/runs/EXP-044/manifest.json").read_text())
          assert x["experiment_id"]=="EXP-044"
          assert x["constraints"]["constraint_id"]=="RF-T005"
          assert x["execution"]["status"]=="planned"
          print("EXP-044 reservation and pre-run manifest PASS")
          PY
      - name: Install frozen environment
        run: uv sync --frozen
      - name: Optimize coupled pi 3L under RF-T005
        run: |
          uv run --frozen python experiments/chatgpt_topology_search/runs/EXP-044/search_pi3l.py \
            --variant ${{ matrix.variant }} --starts 2 --maxiter 80 --coarse 5 --dense 301 \
            --seed 20261016 --output results/EXP-044/${{ matrix.variant }}.json
      - name: Independently check saved winning vector
        if: success()
        run: |
          uv run --frozen python experiments/chatgpt_topology_search/runs/EXP-044/verify_pi3l.py \
            --checkpoint results/EXP-044/${{ matrix.variant }}.json --points 3 \
            | tee results/EXP-044/${{ matrix.variant }}.mna.txt
      - name: Persist numerical evidence and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp044-${{ matrix.variant }}
          path: results/EXP-044/*
          if-no-files-found: warn
