name: Phase 2 Step 5 integrated integrity

on:
  pull_request:
    paths:
      - '.github/workflows/phase2_step5_integration.yml'
      - 'scripts/verify_repository_step5_integration.py'
      - 'src/lpf/legacy_manifest_adapter.py'
      - 'data/validation/exp047_legacy_manifest_adapter_20261017.json'
      - 'docs/phase2_repository_step5_final_verification_20261017.md'
      - 'data/repository_reviews/step5_integration_20261017.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fetch authoritative main history
        run: git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
      - name: Verify original Git blobs, all integrated links and RF source hashes
        run: python3 scripts/verify_repository_step5_integration.py --summary artifacts/phase2_step5_integration.json
      - name: Confirm legacy EXP-047 adapter and registered candidate provenance
        run: python3 -m unittest tests.test_exp047_legacy_manifest_adapter tests.test_phase2_candidate_catalog -v
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
      - name: Synchronize frozen RF analysis test environment
        run: uv sync --frozen
      - name: Reject candidate/manifest drift while adding a temporary formal candidate
        run: uv run --frozen python -m unittest tests.test_candidate_guardrails.CandidateIndexGuardrails.test_additional_current_policy_candidate_does_not_require_audit_edit -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase2-step5-integration-report
          path: artifacts/phase2_step5_integration.json
          retention-days: 30
